<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css box shadow</title>
    <style>
        .box{
            display: flex;
            gap: 2rem;
        }
        .shadow{
            height: 200px;
            width: 200px;
            text-align: center;
            align-content: center;
            font-size: 2rem;
            /* border: 2px solid; */

            /* box-shadow: x-offset y-offset blur spread color; */
        }
        
        #outset{
            box-shadow: 0px 6px 20px -2px gray;
            border-radius: 5px;
        }
        #inset{
            box-shadow: inset 0px 0px 33px 2px gray;
            border-radius: 5px;
        }

    </style>

</head>
<body>
    <div class="box">
        <div class="shadow" id="outset">outset</div>
        <div class="shadow" id="inset">inset</div>
        <div class="shadow"></div>
        <div class="shadow"></div>
    </div>

</body>
</html>
